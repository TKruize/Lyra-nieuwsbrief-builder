<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra Nieuwsbrief Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EDF4FF;--card:#FFFFFF;--navy:#0B1B33;--blue:#4286F6;--muted:#5A6B85;--line:#DDE5F1;--text:#2A3852;--soft:#F7FAFF;--warn:#B45309;--warnbg:#FFF7E6;--ok:#15803D;--okbg:#ECFDF3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Poppins',Arial,Helvetica,sans-serif;color:var(--text);font-size:14px}
  header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
  header h1 span{color:#8DB8FF}
  header .tools{display:flex;gap:8px;flex-wrap:wrap}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;padding:24px;max-width:1500px;margin:0 auto}
  @media (max-width:980px){.wrap{grid-template-columns:1fr;padding:16px}}
  .panel{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .panel>h2{margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--blue)}
  .f{display:block;margin:0 0 12px}
  .f>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;color:var(--navy);background:#fff}
  textarea{resize:vertical;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){.row{grid-template-columns:1fr}}
  .item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--soft)}
  .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;color:var(--navy)}
  .hint{font-size:12px;color:var(--muted);margin:-4px 0 12px;line-height:1.5}
  button{font:inherit;cursor:pointer;border-radius:999px;border:0;font-weight:600;font-size:13px;padding:9px 16px}
  .btn{background:var(--blue);color:#fff}
  .btn:hover{filter:brightness(.95)}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.2)}
  .btn-add{background:#fff;color:var(--blue);border:1px dashed var(--blue);width:100%}
  .btn-link{background:none;color:#B42318;padding:0;font-size:12px}
  .right{position:sticky;top:16px;align-self:start}
  @media (max-width:980px){.right{position:static}}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
  .seg button{background:none;color:var(--muted);padding:6px 14px}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,27,51,.12)}
  .frame{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  iframe{display:block;width:100%;height:62vh;border:0;margin:0 auto;background:#fff}
  .mobile iframe{width:375px;max-width:100%;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .checks{margin:0;padding:0;list-style:none}
  .checks li{padding:8px 12px;border-radius:10px;margin-bottom:6px;background:var(--warnbg);color:var(--warn);line-height:1.45}
  .checks li.ok{background:var(--okbg);color:var(--ok)}
  .checks code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
  #out{width:100%;height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--text);background:var(--soft)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=file]{display:none}
</style>
</head>
<body>

<header>
  <h1>Lyra WMS <span>Nieuwsbrief Builder</span></h1>
  <div class="tools">
    <button type="button" class="btn-ghost" id="btnSave">Concept opslaan</button>
    <button type="button" class="btn-ghost" id="btnLoad">Concept laden</button>
    <button type="button" class="btn-ghost" id="btnReset">Leegmaken</button>
    <input type="file" id="fileIn" accept=".json,application/json">
  </div>
</header>

<div class="wrap">
  <form id="form" autocomplete="off" onsubmit="return false"></form>

  <div class="right">
    <div class="panel">
      <div class="bar">
        <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--blue)">Preview</h2>
        <div class="seg" id="seg">
          <button type="button" class="on" data-view="desktop">Desktop</button>
          <button type="button" data-view="mobile">Mobiel</button>
        </div>
      </div>
      <div class="frame" id="frameWrap"><iframe id="preview" title="Preview van de nieuwsbrief"></iframe></div>
    </div>

    <div class="panel">
      <h2>Check</h2>
      <ul class="checks" id="checks"></ul>
    </div>

    <div class="panel">
      <div class="bar">
        <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--blue)">HTML voor HubSpot</h2>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn" id="btnCopy">Kopieer HTML</button>
        </div>
      </div>
      <textarea id="out" readonly></textarea>
      <p class="hint" style="margin:10px 0 0">Plak dit in het HTML-blok van je HubSpot-marketingmail en vervang alles wat er al staat.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ VASTE INSTELLINGEN ============ */
const LOGO_URL = 'https://25956651.fs1.hubspotusercontent-eu1.net/hubfs/25956651/Asset%201@3x-8.png';
const CALENDLY = 'https://calendly.com/thies-lyrawms/30min';
const AFZENDER = 'Thies';
const STORAGE_KEY = 'lyra-nieuwsbrief-concept';

/* ============ STATE ============ */
const emptyFeature = () => ({naam:'',tekst:'',link:'',linktekst:'',img:''});
const emptyNieuws  = () => ({kop:'',tekst:'',link:'',linktekst:'',img:''});
const emptyKaart   = () => ({label:'',kop:'',tekst:'',link:'',linktekst:''});
const emptyState = () => ({
  doelgroep:'Prospects', maand:'',
  hero:{kop:'',intro:''},
  featuresKop:'', features:[emptyFeature()],
  nieuws:[emptyNieuws()],
  tip:{kop:'',tekst:'',link:'',linktekst:''},
  kaarten:[emptyKaart(), emptyKaart()],
  afsluiting:{kop:'Dat was het voor deze maand',tekst:'',ctaTekst:'',ctaLink:''}
});
let state = emptyState();

/* ============ HULPFUNCTIES ============ */
const NAMED = {'é':'eacute','ë':'euml','è':'egrave','ê':'ecirc','á':'aacute','à':'agrave','ä':'auml','â':'acirc',
  'ï':'iuml','í':'iacute','î':'icirc','ó':'oacute','ö':'ouml','ô':'ocirc','ú':'uacute','ü':'uuml','û':'ucirc',
  'ç':'ccedil','ñ':'ntilde','É':'Eacute','Ë':'Euml','Ö':'Ouml','Ü':'Uuml','€':'euro','•':'bull',
  '‘':'lsquo','’':'rsquo','“':'ldquo','”':'rdquo','…':'hellip','©':'copy','®':'reg','™':'trade'};
function enc(s){
  let o='';
  for (const ch of String(s)){
    if (ch==='&') o+='&amp;';
    else if (ch==='<') o+='&lt;';
    else if (ch==='>') o+='&gt;';
    else if (ch==='"') o+='&quot;';
    else if (NAMED[ch]) o+='&'+NAMED[ch]+';';
    else { const c=ch.codePointAt(0); o += c>127 ? '&#'+c+';' : ch; }
  }
  return o;
}
const attr = s => String(s).trim().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'%3C').replace(/>/g,'%3E');
const escH = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => escH(s).replace(/"/g,'&quot;');
const has = s => !!(s && String(s).trim());
const getP = (o,p) => p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++)a=a[ks[i]];a[ks[ks.length-1]]=v;}

/* ============ HTML GENERATOR (volgt lyra-nieuwsbrief-template.html exact) ============ */
function generate(S){
  const w = [];
  let imgWarned = false;
  const T = s => enc(String(s||'').trim()).replace(/\r?\n+/g,'<br>');
  const L = (url, waar) => { if(!has(url)){ w.push(`Geen link bij ${waar}: <code>#</code> gebruikt.`); return '#'; } return attr(url); };
  const IMG = url => {
    if(!/hubspotusercontent|hubfs/.test(url) && !imgWarned){ imgWarned=true; w.push('Een afbeelding komt niet uit HubSpot Bestanden. Upload hem daar en gebruik die URL.'); }
    return attr(url);
  };

  const SPACER = `        <tr><td style="height:24px;line-height:24px;font-size:0;">&nbsp;</td></tr>`;
  const DIVIDER = `            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:1px solid #DDE5F1;font-size:0;line-height:0;padding-bottom:24px;">&nbsp;</td></tr></table>\n\n`;
  const BAR = `            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="width:48px;height:4px;background-color:#4286F6;border-radius:4px;font-size:0;line-height:0;">&nbsp;</td></tr></table>`;
  const secs = [];

  /* HERO */
  if(!has(S.maand)) w.push('Maand ontbreekt.');
  if(!has(S.hero.kop)) w.push('Hero-kop ontbreekt (verplicht).');
  if(!has(S.hero.intro)) w.push('Hero-intro ontbreekt (verplicht).');
  else if ((S.hero.intro.match(/[.!?](\s|$)/g)||[]).length > 2) w.push('Hero-intro is langer dan 2 zinnen.');
  secs.push(
`        <tr>
          <td style="background-color:#FFFFFF;border-radius:20px;padding:40px 40px 36px;" align="center">
            <p style="margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#4286F6;">Nieuwsbrief &bull; ${T(S.maand)} editie</p>
            <h1 style="margin:0 0 16px;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-0.6px;color:#0B1B33;">${T(S.hero.kop)}</h1>
            <p style="margin:0;font-size:16px;line-height:1.6;color:#5A6B85;">${T(S.hero.intro)}</p>
          </td>
        </tr>`);

  /* NIEUWE FUNCTIES */
  const feats = S.features.filter(f => has(f.naam) || has(f.tekst));
  if (feats.length){
    if(!has(S.featuresKop)) w.push('Kop van de sectie Nieuwe functies ontbreekt.');
    const items = feats.map((f,i) => {
      let s = '';
      if (has(f.img)) s += `            <img src="${IMG(f.img)}" width="520" alt="${enc(f.naam.trim()||'Nieuwe functie')}" style="display:block;border:0;outline:none;width:100%;max-width:520px;height:auto;border-radius:12px;margin:0 0 20px;">\n`;
      s += `            <h3 style="margin:0 0 8px;font-size:18px;line-height:1.3;font-weight:700;color:#0B1B33;">${T(f.naam)}</h3>\n`;
      s += `            <p style="margin:0 0 12px;font-size:16px;line-height:1.6;color:#2A3852;">${T(f.tekst)}</p>\n`;
      s += `            <p style="margin:0 0 28px;"><a href="${L(f.link,'feature "'+(f.naam||i+1)+'"')}" style="font-size:15px;font-weight:600;color:#4286F6;text-decoration:underline;">${T(f.linktekst||'Lees meer')}</a></p>\n\n`;
      return s;
    });
    secs.push(
`        <tr>
          <td style="background-color:#FFFFFF;border-radius:20px;padding:36px 40px 12px;">
${BAR}
            <p style="margin:12px 0 4px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#4286F6;">Nieuwe functies</p>
            <h2 style="margin:0 0 24px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-0.4px;color:#0B1B33;">${T(S.featuresKop)}</h2>

${items.join(DIVIDER).replace(/\n+$/,'')}
          </td>
        </tr>`);
  }

  /* NIEUWS (herhaalbaar) */
  S.nieuws.filter(n => has(n.kop) || has(n.tekst)).forEach(n => {
    let s = `        <tr>
          <td style="background-color:#FFFFFF;border-radius:20px;padding:36px 40px;">
${BAR}
            <p style="margin:12px 0 4px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#4286F6;">Nieuws</p>\n`;
    if (has(n.img)) s += `            <img src="${IMG(n.img)}" width="520" alt="${enc(n.kop.trim()||'Nieuws')}" style="display:block;border:0;outline:none;width:100%;max-width:520px;height:auto;border-radius:12px;margin:8px 0 20px;">\n`;
    s += `            <h2 style="margin:0 0 12px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-0.4px;color:#0B1B33;">${T(n.kop)}</h2>
            <p style="margin:0 0 12px;font-size:16px;line-height:1.6;color:#2A3852;">${T(n.tekst)}</p>
            <p style="margin:0;"><a href="${L(n.link,'nieuws "'+(n.kop||'')+'"')}" style="font-size:15px;font-weight:600;color:#4286F6;text-decoration:underline;">${T(n.linktekst||'Lees meer')}</a></p>
          </td>
        </tr>`;
    secs.push(s);
  });

  /* TIP */
  const tp = S.tip;
  if (has(tp.kop) || has(tp.tekst)){
    let s = `        <tr>
          <td style="background-color:#0B1B33;border-radius:20px;padding:36px 40px;">
            <p style="margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#8DB8FF;">Tip van de maand</p>
            <h2 style="margin:0 0 12px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-0.4px;color:#FFFFFF;">${T(tp.kop)}</h2>
            <p style="margin:0;font-size:16px;line-height:1.6;color:#DAE9FF;">${T(tp.tekst)}</p>\n`;
    if (has(tp.link)) s += `            <p style="margin:12px 0 0;"><a href="${attr(tp.link)}" style="font-size:15px;font-weight:600;color:#8DB8FF;text-decoration:underline;">${T(tp.linktekst||'Lees meer')}</a></p>\n`;
    s += `          </td>
        </tr>`;
    secs.push(s);
  }

  /* KAARTEN */
  const cards = S.kaarten.filter(k => has(k.kop) || has(k.tekst));
  if (cards.length){
    const cell = (k, width) => `                <td width="${width}" valign="top" style="background-color:#FFFFFF;border-radius:20px;padding:28px 24px;">
                  <p style="margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#4286F6;">${T(k.label)}</p>
                  <h3 style="margin:0 0 8px;font-size:18px;line-height:1.3;font-weight:700;color:#0B1B33;">${T(k.kop)}</h3>
                  <p style="margin:0 0 12px;font-size:15px;line-height:1.55;color:#2A3852;">${T(k.tekst)}</p>
                  <a href="${L(k.link,'kaart "'+(k.kop||'')+'"')}" style="font-size:15px;font-weight:600;color:#4286F6;text-decoration:underline;">${T(k.linktekst||'Lees meer')}</a>
                </td>`;
    const inner = cards.length === 2
      ? cell(cards[0],'48%') + `\n                <td width="4%" style="font-size:0;">&nbsp;</td>\n` + cell(cards[1],'48%')
      : cell(cards[0],'100%');
    secs.push(`        <tr>
          <td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
${inner}
              </tr>
            </table>
          </td>
        </tr>`);
  }

  /* AFSLUITING */
  const a = S.afsluiting;
  const isP = S.doelgroep === 'Prospects';
  let ctaT = a.ctaTekst, ctaL = a.ctaLink;
  if (!has(ctaT)) ctaT = isP ? 'Plan een gesprek' : '';
  if (!has(ctaL)) ctaL = isP ? CALENDLY : '';
  if (!isP && (!has(ctaT) || !has(ctaL))) w.push('Doelgroep Klanten: vul CTA-tekst en CTA-link in.');
  if (!has(a.tekst)) w.push('Afsluitingstekst ontbreekt.');
  secs.push(`        <tr>
          <td style="background-color:#FFFFFF;border-radius:20px;padding:40px;" align="center">
            <h2 style="margin:0 0 12px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-0.4px;color:#0B1B33;">${T(a.kop||'Dat was het voor deze maand')}</h2>
            <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#5A6B85;">${T(a.tekst)}</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#4286F6" style="border-radius:999px;">
                  <a href="${has(ctaL)?attr(ctaL):'#'}" style="display:inline-block;padding:14px 32px;font-family:'Poppins',Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:999px;">${T(ctaT||'Plan een gesprek')}</a>
                </td>
              </tr>
            </table>
            <p style="margin:36px 0 0;font-size:16px;line-height:1.5;color:#2A3852;">Tot volgende maand,<br><strong style="color:#0B1B33;">${enc(AFZENDER)}</strong><br><span style="font-size:14px;color:#5A6B85;">Lyra WMS</span></p>
          </td>
        </tr>`);

  /* Algemene tekstchecks */
  const strings = [];
  (function walk(o){ if (typeof o === 'string') strings.push(o); else if (o && typeof o === 'object') Object.values(o).forEach(walk); })(S);
  const all = strings.join('\n');
  if (/[\u2013\u2014]/.test(all)) w.push('Er staat een em dash of en dash in de tekst. Vervang die door een punt, komma of dubbele punt.');
  if (/\[[^\]]+\]|\{\{/.test(all)) w.push('Er staat nog een placeholder tussen [ ] of {{ }} in je invoer.');

  const html =
`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EDF4FF;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;font-family:'Poppins',Arial,Helvetica,sans-serif;">

        <tr>
          <td align="center" style="padding:16px 0 24px;">
            <img src="${LOGO_URL}" width="180" alt="Lyra WMS" style="display:block;border:0;outline:none;text-decoration:none;width:180px;max-width:180px;height:auto;margin:0 auto;">
          </td>
        </tr>

${secs.join('\n\n' + SPACER + '\n\n')}

        <tr><td style="height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>

      </table>
    </td>
  </tr>
</table>`;
  return {html, warnings:w};
}

/* ============ FORMULIER ============ */
function inp(path, label, o={}){
  const v = getP(state,path) ?? '';
  const ph = escA(o.ph||'');
  if (o.area) return `<label class="f"><span>${label}</span><textarea data-path="${path}" rows="${o.rows||3}" placeholder="${ph}">${escH(v)}</textarea></label>`;
  return `<label class="f"><span>${label}</span><input type="text" data-path="${path}" value="${escA(v)}" placeholder="${ph}"></label>`;
}
const panel = (title, body) => `<section class="panel"><h2>${title}</h2>${body}</section>`;
const del = (list,i) => `<button type="button" class="btn-link" data-action="del" data-list="${list}" data-i="${i}">Verwijderen</button>`;

function renderForm(){
  const S = state;
  let h = '';
  h += panel('Algemeen', `<div class="row">
      <label class="f"><span>Doelgroep</span><select data-path="doelgroep">
        <option${S.doelgroep==='Prospects'?' selected':''}>Prospects</option>
        <option${S.doelgroep==='Klanten'?' selected':''}>Klanten</option>
      </select></label>
      ${inp('maand','Maand',{ph:'november'})}</div>`);

  h += panel('Hero (verplicht)', inp('hero.kop','Kop') + inp('hero.intro','Intro (max. 2 zinnen)',{area:1}));

  let f = inp('featuresKop','Kop van de sectie');
  S.features.forEach((it,i) => {
    f += `<div class="item"><div class="item-head">Feature ${i+1}${del('features',i)}</div>
      ${inp(`features.${i}.naam`,'Naam')}
      ${inp(`features.${i}.tekst`,'Tekst (2 tot 3 zinnen)',{area:1})}
      <div class="row">${inp(`features.${i}.link`,'Link',{ph:'https://'})}${inp(`features.${i}.linktekst`,'Linktekst',{ph:'Bekijk hoe het werkt'})}</div>
      ${inp(`features.${i}.img`,'Afbeelding-URL (optioneel)',{ph:'https://...hubfs/...'})}</div>`;
  });
  f += `<p class="hint">Afbeeldingen: 1040 px breed, opgeslagen in HubSpot Bestanden.</p><button type="button" class="btn-add" data-action="add" data-list="features">+ Feature toevoegen</button>`;
  h += panel('Nieuwe functies (optioneel)', f);

  let n = '';
  S.nieuws.forEach((it,i) => {
    n += `<div class="item"><div class="item-head">Nieuwsbericht ${i+1}${del('nieuws',i)}</div>
      ${inp(`nieuws.${i}.kop`,'Kop')}
      ${inp(`nieuws.${i}.tekst`,'Tekst (2 tot 3 zinnen)',{area:1})}
      <div class="row">${inp(`nieuws.${i}.link`,'Link',{ph:'https://'})}${inp(`nieuws.${i}.linktekst`,'Linktekst',{ph:'Lees meer'})}</div>
      ${inp(`nieuws.${i}.img`,'Afbeelding-URL (optioneel)',{ph:'https://...hubfs/...'})}</div>`;
  });
  n += `<button type="button" class="btn-add" data-action="add" data-list="nieuws">+ Nieuwsbericht toevoegen</button>`;
  h += panel('Nieuws (optioneel)', n);

  h += panel('Tip van de maand (optioneel)',
    inp('tip.kop','Kop') + inp('tip.tekst','Tekst',{area:1}) +
    `<div class="row">${inp('tip.link','Link (optioneel)',{ph:'https://'})}${inp('tip.linktekst','Linktekst',{ph:'Lees meer'})}</div>`);

  let k = `<p class="hint">Twee kaarten komen naast elkaar. Vul je er maar één in, dan wordt die over de volle breedte getoond.</p>`;
  S.kaarten.forEach((it,i) => {
    k += `<div class="item"><div class="item-head">Kaart ${i+1}</div>
      <div class="row">${inp(`kaarten.${i}.label`,'Label',{ph:i?'Integraties':'Nieuwe content'})}${inp(`kaarten.${i}.kop`,'Kop')}</div>
      ${inp(`kaarten.${i}.tekst`,'Tekst (1 zin)',{area:1,rows:2})}
      <div class="row">${inp(`kaarten.${i}.link`,'Link',{ph:'https://'})}${inp(`kaarten.${i}.linktekst`,'Linktekst',{ph:i?'Alle integraties':'Lezen'})}</div></div>`;
  });
  h += panel('Kaarten (optioneel)', k);

  const isP = S.doelgroep === 'Prospects';
  h += panel('Afsluiting (verplicht)',
    inp('afsluiting.kop','Kop') + inp('afsluiting.tekst','Tekst',{area:1}) +
    `<div class="row">${inp('afsluiting.ctaTekst','Knoptekst',{ph:isP?'Plan een gesprek':'Verplicht voor klanten'})}${inp('afsluiting.ctaLink','Knoplink',{ph:isP?CALENDLY:'Verplicht voor klanten'})}</div>
     <p class="hint">${isP ? 'Leeg laten = "Plan een gesprek" met de Calendly-link.' : 'Bij klanten vul je knoptekst en link zelf in.'}</p>`);

  document.getElementById('form').innerHTML = h;
}

/* ============ UPDATE ============ */
let saveTimer;
function update(){
  const {html, warnings} = generate(state);
  document.getElementById('out').value = html;
  document.getElementById('preview').srcdoc =
    '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#EDF4FF}</style></head><body>' + html + '</body></html>';
  document.getElementById('checks').innerHTML = warnings.length
    ? warnings.map(x => `<li>${x}</li>`).join('')
    : '<li class="ok">Alles compleet</li>';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }, 400);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============ EVENTS ============ */
const form = document.getElementById('form');
form.addEventListener('input', e => {
  const p = e.target.dataset && e.target.dataset.path;
  if (!p) return;
  setP(state, p, e.target.value);
  if (p === 'doelgroep') renderForm();
  update();
});
form.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const list = b.dataset.list;
  if (b.dataset.action === 'add') state[list].push(list === 'features' ? emptyFeature() : emptyNieuws());
  if (b.dataset.action === 'del') state[list].splice(+b.dataset.i, 1);
  renderForm(); update();
});

document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('frameWrap').classList.toggle('mobile', b.dataset.view === 'mobile');
});

document.getElementById('btnCopy').addEventListener('click', async () => {
  const out = document.getElementById('out');
  try { await navigator.clipboard.writeText(out.value); }
  catch(e){ out.select(); document.execCommand('copy'); }
  toast('HTML gekopieerd');
});

document.getElementById('btnSave').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nieuwsbrief-' + (state.maand.trim() || 'concept').toLowerCase().replace(/\s+/g,'-') + '.json';
  a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById('btnLoad').addEventListener('click', () => document.getElementById('fileIn').click());
document.getElementById('fileIn').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try { state = Object.assign(emptyState(), JSON.parse(r.result)); renderForm(); update(); toast('Concept geladen'); }
    catch(err){ toast('Dit bestand kan ik niet lezen'); }
  };
  r.readAsText(file); e.target.value = '';
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('Alle velden leegmaken?')) return;
  state = emptyState(); renderForm(); update();
});

/* ============ START ============ */
try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) state = Object.assign(emptyState(), JSON.parse(saved)); } catch(e){}
renderForm(); update();
</script>
</body>
</html>
